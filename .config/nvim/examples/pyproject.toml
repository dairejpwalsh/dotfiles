[project]
name = "geospatial-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright",
  "pytest",
  "ruff",
]

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [
  ".venv",
  "data",
  "outputs",
  "scratch",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "data",
  "outputs",
  "scratch",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
